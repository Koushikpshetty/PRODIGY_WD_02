<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch Web Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="stopwatch-card">
            <h1>Stopwatch</h1>
            
            <div class="display">
                <div class="time">
                    <span class="hours">00</span><span class="separator">:</span><span class="minutes">00</span><span class="separator">:</span><span class="seconds">00</span><span class="separator">:</span><span class="milliseconds">00</span>
                </div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-start">Start</button>
                <button id="pauseBtn" class="btn btn-pause" disabled>Pause</button>
                <button id="resetBtn" class="btn btn-reset">Reset</button>
                <button id="lapBtn" class="btn btn-lap" disabled>Lap</button>
            </div>

            <div class="laps-section">
                <h2>Lap Times</h2>
                <ul id="lapsList" class="laps-list">
                    <!-- Lap times will be added here -->
                </ul>
            </div>

            <button id="clearLapsBtn" class="btn btn-clear-laps" style="display: none;">Clear Laps</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
